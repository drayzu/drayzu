<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Escena</title>
<style>html,body{margin:0;background:#0d1117;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/potencias/node_modules/three/build/three.module.js",
  "three/addons/": "/potencias/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<script type="module">
// Deterministic scenes for the profile sequence, after the engine in drayzu.github.io/prototypes/vuelo.html.
// ?pieza=tiempo|civilizacion|astroingenieria|astro2|civ2|infinito  —  window.renderAt(seconds) draws one frame; nothing runs on its own.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const PIECE = new URLSearchParams(location.search).get('pieza') || 'tiempo';
const TAU = Math.PI * 2;

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.002, 6000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth * devicePixelRatio, innerHeight * devicePixelRatio), 0.7, 0.55, 0.16);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ------------------------------------------------------------------ helpers (as in vuelo.html)
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng({ tiempo: 11, civilizacion: 23, astroingenieria: 37, astro2: 41, civ2: 29, 'infinito-niveles': 53, infinito: 61 }[PIECE] || 1);
const gauss = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
const randDir = () => { const z = R() * 2 - 1, a = R() * TAU, r = Math.sqrt(1 - z * z); return [r * Math.cos(a), r * Math.sin(a), z]; };
const col = hex => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

const C = { time: col(0x8fb4ff), civ: col(0x6fe3c1), astro: col(0xe3c48a), ink: col(0xece7db), white: col(0xffffff),
            warm: col(0xffd9a0), red: col(0x7a2a2a), amber: col(0xffb46b), coral: col(0xff7a59), blue: col(0xb9cdff), pink: col(0xff8fb0) };

const shared = { uTime: { value: 0 }, uScale: { value: 1 } };
const HEAD = /* glsl */`
  uniform float uTime; uniform float uScale; uniform float uOpacity;
  attribute vec3 aColor; attribute float aSize; attribute float aSeed;
  varying vec3 vColor; varying float vAlpha;
  void emit(vec3 p, float size, vec3 c, float alpha) {
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float ps = size * uScale / max(-mv.z, 0.0001);
    float a = alpha;
    if (ps < 1.6) { a *= ps / 1.6; ps = 1.6; }
    gl_PointSize = min(ps, 128.0);
    gl_Position = projectionMatrix * mv;
    vColor = c; vAlpha = a * uOpacity;
  }`;
const FRAG = /* glsl */`
  varying vec3 vColor; varying float vAlpha;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    if (d > 0.5) discard;
    float a = smoothstep(0.5, 0.0, d); a *= a;
    gl_FragColor = vec4(vColor * a * vAlpha, 1.0);
  }`;
function points(attrs, body, uniforms = {}) {
  const g = new THREE.BufferGeometry();
  for (const [name, [arr, size]] of Object.entries(attrs)) g.setAttribute(name, new THREE.Float32BufferAttribute(arr, size));
  const m = new THREE.ShaderMaterial({ uniforms: { ...shared, uOpacity: { value: 1 }, ...uniforms },
    vertexShader: HEAD + body, fragmentShader: FRAG, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const p = new THREE.Points(g, m); p.frustumCulled = false; return p;
}
function buffers(n) { return { pos: new Float32Array(n * 3), col: new Float32Array(n * 3), size: new Float32Array(n), seed: new Float32Array(n) }; }
function put(b, i, p, c, s) { b.pos.set(p, i * 3); b.col.set(c, i * 3); b.size[i] = s; b.seed[i] = R(); }
const std = b => ({ position: [b.pos, 3], aColor: [b.col, 3], aSize: [b.size, 1], aSeed: [b.seed, 1] });
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, 'rgba(255,255,255,.5)');
  gr.addColorStop(.5, 'rgba(255,255,255,.1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
function glow(color, scale, opacity = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity }));
  s.scale.setScalar(scale); return s;
}
function sky(n, r0, r1) {
  const b = buffers(n);
  for (let i = 0; i < n; i++) {
    const d = randDir(), r = r0 + R() * (r1 - r0);
    put(b, i, d.map(v => v * r), [C.white, C.warm, C.blue, C.ink][Math.floor(R() * 4)], (R() < .03 ? 6 : 1.4 + R() * 2.4) * (r / 1000));
  }
  return points(std(b), `void main(){ float tw = 0.55 + 0.45 * sin(uTime * (0.5 + aSeed * 2.0) + aSeed * 60.0); emit(position, aSize, aColor, tw * 0.8); }`);
}

let update = () => {};

// ------------------------------------------------------------------ Tiempo: the universe is written as the light goes through it
if (PIECE === 'tiempo') {
  scene.add(sky(7000, 700, 1500));
  const coneR = u => .15 + 1.6 * smooth(0, .06, u) + 5.2 * Math.pow(u, 1.7);
  const X = u => -13 + 26 * u;
  const n = 52000, b = buffers(n), uu = new Float32Array(n);
  let i = 0;
  const add = (u, rad, c, s) => { const a = R() * TAU; put(b, i, [X(u), Math.cos(a) * rad, Math.sin(a) * rad], c, s); uu[i] = u; i++; };
  const ageTint = (c, u) => u > .84 ? mix3(c, C.red, smooth(.84, 1, u) * .85) : c;
  for (let k = 0; k < 20000; k++) {              // the edge of the expanding universe
    const u = Math.pow(R(), .85);
    const c = u < .05 ? C.white : mix3(C.white, C.time, Math.min(u * 4, 1));
    add(u, coneR(u) * (.965 + R() * .035), ageTint(c, u), .055);
  }
  for (let k = 0; k < 6000; k++) {               // the cosmic microwave background, a speckled wall
    const u = .27 + gauss() * .004;
    add(u, coneR(u) * Math.sqrt(R()), [C.amber, C.coral, C.time, C.blue][Math.floor(R() * 4)], .07);
  }
  for (let k = 0; k < 14000; k++) {              // stars, after the dark ages
    const u = .33 + R() * .67;
    add(u, coneR(u) * Math.sqrt(R()) * .93, ageTint(R() < .12 ? C.warm : mix3(C.white, C.blue, R()), u), .035 + R() * .05);
  }
  for (let g = 0; g < 60; g++) {                 // galaxies: little spirals
    const u0 = .4 + R() * .48, r0 = coneR(u0) * Math.sqrt(R()) * .8, a0 = R() * TAU;
    const cx = X(u0), cy = Math.cos(a0) * r0, cz = Math.sin(a0) * r0;
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(R() * TAU, R() * TAU, 0)), v = new THREE.Vector3();
    const size = .18 + R() * .25, warm = R() < .5;
    for (let k = 0; k < 200 && i < n; k++) {
      const r = size * Math.pow(R(), .7), th = (k % 2) * Math.PI + 3 * Math.log(1 + r / size * 4) + gauss() * .35;
      v.set(Math.cos(th) * r, gauss() * .015, Math.sin(th) * r).applyQuaternion(q);
      const c = mix3(warm ? C.warm : C.blue, C.white, R() * .5);
      put(b, i, [cx + v.x, cy + v.y, cz + v.z], ageTint(c, u0), r < size * .2 ? .05 : .03); uu[i] = u0; i++;
    }
  }
  while (i < n) add(.33 + R() * .67, coneR(.5) * Math.sqrt(R()) * .5, C.blue, .02);
  const uLight = { value: 0 };
  scene.add(points({ ...std(b), aU: [uu, 1] }, `
    attribute float aU; uniform float uLight;
    void main(){
      float lit = smoothstep(aU - 0.004, aU + 0.025, uLight);           // written once the light has passed
      float near = exp(-pow((aU - uLight) / 0.025, 2.0));                // flare at the front
      float late = smoothstep(0.86, 1.0, aU) * smoothstep(0.9, 1.0, uLight);
      float tw = 0.75 + 0.25 * sin(uTime * (1.0 + aSeed * 2.0) + aSeed * 30.0);
      float a = (0.06 + 0.5 * lit + 0.55 * near) * tw * (1.0 - 0.6 * late);
      emit(position, aSize * (1.0 + 0.6 * near), aColor + vec3(0.15) * near, a);
    }`, { uLight }));
  // the light, with a trail
  const m = 90, pl = buffers(m), idx = new Float32Array(m);
  for (let k = 0; k < m; k++) { put(pl, k, [0, 0, 0], mix3(C.white, C.time, k / m), k === 0 ? .5 : .24); idx[k] = k; }
  scene.add(points({ ...std(pl), aIdx: [idx, 1] }, `
    attribute float aIdx; uniform float uLight; uniform float uFade;
    void main(){
      float x = -13.0 + 26.0 * uLight - aIdx * 0.09;
      float a = pow(1.0 - aIdx / 90.0, 2.0) * step(-13.0, x) * uFade;
      emit(vec3(x, 0.0, 0.0), aSize, aColor, a * 0.9);
    }`, { uLight, uFade: { value: 1 } }));
  const head = scene.children[scene.children.length - 1];
  const bang = glow(0xcfe0ff, 6, .95); bang.position.set(-13, 0, 0); scene.add(bang);
  const front = glow(0x8fb4ff, 2, .7); scene.add(front);
  const D = 8.6;
  update = t => {
    const e = smooth(0.25, D - .7, t);
    uLight.value = Math.pow(e, 1.25);
    const x = X(uLight.value);
    bang.scale.setScalar(1.2 + 6 * Math.exp(-t * 2.5));
    bang.material.opacity = .25 + .45 * Math.exp(-t * 1.5);
    front.position.set(x, 0, 0); front.scale.setScalar(1 + coneR(uLight.value) * .15);
    front.material.opacity = .3 * (1 - smooth(D - 1.2, D - .2, t));
    head.material.uniforms.uFade.value = 1 - smooth(D - 1.2, D - .2, t);
    const k = smooth(0, D, t);
    const cx = lerp(-13.5, 3, k);
    camera.position.set(cx - 3.5, lerp(1.6, 5, k), lerp(6.5, 25, k));
    camera.lookAt(cx + lerp(2.5, 3.5, k), 0, 0);
  };
}

// ------------------------------------------------------------------ Civilización: a star is wrapped, then a galaxy is lit
if (PIECE === 'civilizacion') {
  scene.add(sky(7000, 700, 1500));
  const galaxy = new THREE.Group(); scene.add(galaxy);
  galaxy.rotation.set(0, 0, 0);
  const n = 52000, b = buffers(n);
  for (let i = 0; i < n; i++) {
    const k = R();
    let p, c, s;
    if (k < .14) { p = [gauss() * 1.2, gauss() * .55, gauss() * 1.2]; c = mix3(C.warm, C.white, R() * .6).map(v => v * .3); s = .06 + R() * .04; }
    else {
      const dust = k > .86, r = 1 + 13 * Math.pow(R(), .9), arm = Math.floor(R() * 2);
      const th = arm * Math.PI + 2.3 * Math.log(r) + gauss() * .22 * (1 + 2.5 / r) + (dust ? .28 : 0);
      const sp = .35 + r * .03;
      p = [Math.cos(th) * r + gauss() * sp, gauss() * .22 * Math.exp(-r / 10), Math.sin(th) * r + gauss() * sp];
      c = dust ? [.18, .13, .1] : R() < .04 ? C.pink : mix3(C.blue, C.white, R() * .6);
      s = dust ? .1 : R() < .04 ? .14 : .045 + R() * .05;
    }
    put(b, i, p, c, s);
  }
  const r0 = 7.5, th0 = 2.3 * Math.log(r0);
  const seed = new THREE.Vector3(Math.cos(th0) * r0, 0, Math.sin(th0) * r0);
  const uBubble = { value: 0 }, uGal = { value: 0 }, uHide = { value: 1 };
  galaxy.add(points(std(b), `
    uniform vec3 uSeedP; uniform float uBubble; uniform vec3 uTeal; uniform float uGal; uniform float uHide;
    void main(){
      float d = distance(position, uSeedP);
      float lit = 1.0 - smoothstep(uBubble - 1.6, uBubble, d);
      float ring = exp(-pow((d - uBubble) / 0.45, 2.0)) * step(0.3, uBubble);
      vec3 cc = mix(aColor, uTeal, lit * 0.85) + uTeal * ring * 0.7;
      float hide = uHide < 0.001 ? 1.0 : smoothstep(uHide * 0.6, uHide, d);
      emit(position, aSize * (1.0 + 0.3 * lit + 0.8 * ring), cc, (0.5 + 0.6 * ring) * uGal * hide);
    }`, { uSeedP: { value: seed }, uBubble, uTeal: { value: new THREE.Vector3(...C.civ) }, uGal, uHide }));
  galaxy.add(glow(0xffe2b8, 6, .18));

  // the star system, tiny inside the galaxy
  const sys = new THREE.Group(); sys.position.copy(seed); sys.scale.setScalar(.0075); galaxy.add(sys);
  const starMat = new THREE.ShaderMaterial({
    uniforms: { ...shared },
    vertexShader: `varying vec3 vN; varying vec3 vP; varying vec3 vV;
      void main(){ vN = normalize(normalMatrix * normal); vP = position; vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uTime; varying vec3 vN; varying vec3 vP; varying vec3 vV;
      float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
      float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
      void main(){
        float g = n3(vP * 1.1 + uTime * 0.2) * 0.6 + n3(vP * 3.0 - uTime * 0.3) * 0.4;
        vec3 c = mix(vec3(0.8, 0.16, 0.02), vec3(1.0, 0.55, 0.15), smoothstep(0.3, 0.75, g));
        c = mix(c, vec3(1.0, 0.85, 0.55), smoothstep(0.75, 1.0, g));
        float mu = max(dot(vN, vV), 0.0);
        gl_FragColor = vec4(c * (0.35 + 0.75 * pow(mu, 0.6)), 1.0);
      }`,
  });
  sys.add(new THREE.Mesh(new THREE.SphereGeometry(4, 96, 64), starMat));
  const starGlow = glow(0xff9a4a, 26, .3); sys.add(starGlow);
  const starGlow2 = glow(0xffd9a0, 10.5, .25); sys.add(starGlow2);
  // Dyson swarm: panels on inclined orbits, revealed one by one
  const m = 9000, sw = buffers(m), orb = new Float32Array(m * 3);
  for (let k = 0; k < m; k++) {
    const ring = Math.floor(R() * 9);
    orb.set([5.4 + ring * .32 + gauss() * .05, (ring * 0.71) % Math.PI, ring * 1.37], k * 3);
    put(sw, k, [0, 0, 0], mix3(C.civ, R() < .3 ? C.astro : C.white, R() * .35), .0011 + R() * .0008);
  }
  const uReveal = { value: 0 };
  sys.add(points({ ...std(sw), aOrb: [orb, 3] }, `
    attribute vec3 aOrb; uniform float uReveal;
    void main(){
      float a = aSeed * 6.2831 + uTime * (0.35 + 0.25 * fract(aSeed * 13.0));
      vec3 p = vec3(cos(a), 0.0, sin(a)) * aOrb.x;
      float ci = cos(aOrb.y), si = sin(aOrb.y); p.yz = mat2(ci, -si, si, ci) * p.yz;
      float cn = cos(aOrb.z), sn = sin(aOrb.z); p.xz = mat2(cn, -sn, sn, cn) * p.xz;
      float on = smoothstep(aSeed - 0.04, aSeed, uReveal);
      float spark = exp(-pow((aSeed - uReveal) / 0.02, 2.0));
      emit(p, aSize * (1.0 + 2.0 * spark), aColor + vec3(0.6) * spark, on * 0.9 + spark);
    }`, { uReveal }));
  const D = 9.0;
  const view = new THREE.Vector3();
  update = t => {
    galaxy.rotation.y = -t * .02;
    galaxy.updateMatrixWorld();
    const seedW = galaxy.localToWorld(seed.clone());
    uReveal.value = smooth(.2, 3.6, t);
    starGlow.material.opacity = .3 - .18 * uReveal.value;
    starGlow2.material.opacity = .25 - .15 * uReveal.value;
    const z = smooth(3.0, 7.6, t);                                    // the camera leaves the star
    const dist = Math.exp(lerp(Math.log(.26), Math.log(31), z));
    const target = seedW.lerp(new THREE.Vector3(0, 0, 0), smooth(3.6, 7.8, t));
    view.set(lerp(.55, -.25, z), lerp(.22, 1.05, z), lerp(1, .55, z)).normalize();
    camera.position.copy(target).addScaledVector(view, dist);
    camera.lookAt(target);
    uGal.value = smooth(.7, 5, dist);
    uHide.value = 2.2 * (1 - smooth(5, 14, dist));
    uBubble.value = 11.5 * smooth(5.0, 8.9, t);
  };
}

// ------------------------------------------------------------------ AstroIngeniería: an inhabited ring, then a star being rebuilt
if (PIECE === 'astroingenieria') {
  scene.add(sky(7000, 700, 1500));
  const NOISE = /* glsl */`
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
      i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
      vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 105.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }`;
  const GOLD = new THREE.Color(0xe3c48a);

  // the star, as in vuelo.html
  const starMat = new THREE.ShaderMaterial({
    uniforms: { ...shared },
    vertexShader: `varying vec3 vN; varying vec3 vP; varying vec3 vV;
      void main(){ vN = normalize(normalMatrix * normal); vP = position; vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uTime; varying vec3 vN; varying vec3 vP; varying vec3 vV;
      ${NOISE}
      void main(){
        float n = snoise(vP * 0.45 + vec3(0.0, uTime * 0.04, 0.0)) * 0.6 + snoise(vP * 1.3 - uTime * 0.09) * 0.3 + snoise(vP * 3.5 + uTime * 0.15) * 0.15;
        float g = 0.55 + 0.45 * n;

  const uReveal = { value: .1 };

    fragmentShader: `uniform vec3 uSun; uniform vec3 uGold; varying vec3 vN; varying vec3 vP; varying vec3 vV;

    const m = 600, e = buffers(m);  // the elevator: a thread of light from the equator to the ring

    ringGroup.add(points(std(e), `void main(){ float pulse = exp(-pow(fract(aSeed * 0.0 + position.x * 0.6 - uTime * 0.5) - 0.5, 2.0) * 60.0);

  const D = 9.0;

// ------------------------------------------------------------------ the particle language of Potencias and Tiempo
// astro2 and civ2: everything made of points of light, one continuous camera move across scales, and a
// zoom blur that follows the speed of the zoom (as in the sites themselves).
const SNOISE = /* glsl */`
  vec3 m289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 m289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 perm(vec4 x){return m289(((x*34.0)+10.0)*x);}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
    i=m289(i);
    vec4 p=perm(perm(perm(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 nr=1.79284291400159-0.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));
    p0*=nr.x;p1*=nr.y;p2*=nr.z;p3*=nr.w;
    vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
    return 105.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }`;

// a zoom blur, as in the sites: strength from how fast the camera's distance changes (in decades)
const zoomBlur = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uStrength: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uStrength; varying vec2 vUv;
    void main(){
      vec2 d = (vec2(0.5) - vUv) * uStrength;
      vec4 c = vec4(0.0);
      for (int i = 0; i < 14; i++) c += texture2D(tDiffuse, vUv + d * float(i) / 14.0);
      gl_FragColor = c / 14.0;
    }`,
});
composer.insertPass(zoomBlur, 1);
let distAt = null;   // a piece's camera distance at time t, for the blur

// a star as a ball of boiling light (its granulation from noise), and its corona
function particleStar(n, radius, size, uniforms = {}) {
  const b = buffers(n);
  for (let i = 0; i < n; i++) { const d = randDir(), r = radius * (1 + Math.abs(gauss()) * .012); put(b, i, d.map(v => v * r), C.white, size * (.7 + R() * .6)); }
  return points(std(b), `${SNOISE}
    uniform float uDim; uniform float uR; uniform float uLum;
    void main(){
      vec3 q = position / uR;
      float g = snoise(q * 2.6 + vec3(0.0, uTime * 0.12, 0.0)) * 0.6 + snoise(q * 7.0 - uTime * 0.25) * 0.4;
      vec3 c = mix(vec3(0.9, 0.22, 0.04), vec3(1.0, 0.62, 0.2), smoothstep(-0.3, 0.4, g));
      c = mix(c, vec3(1.0, 0.85, 0.55), smoothstep(0.55, 0.95, g));
      emit(position, aSize, c, uLum * uDim);
    }`, { uDim: { value: 1 }, uR: { value: radius }, uLum: { value: .55 }, ...uniforms });
}
function corona(n, radius, size) {
  const b = buffers(n);
  for (let i = 0; i < n; i++) { const d = randDir(), r = radius * (1 + Math.pow(R(), 2.2) * .5); put(b, i, d.map(v => v * r), mix3(C.amber, C.warm, R()), size * (.6 + R())); }
  return points(std(b), `uniform float uDim; uniform float uR;
    void main(){ float h = (length(position) / uR - 1.0) / 0.5; float f = 0.5 + 0.5 * sin(uTime * (0.6 + aSeed) + aSeed * 40.0);
      emit(position, aSize, aColor, 0.18 * (1.0 - h) * f * uDim); }`, { uDim: { value: 1 }, uR: { value: radius } });
}
// a planet of points: oceans and land in daylight, the night side lit by its cities
function particlePlanet(n, radius, size, sunDir, cityCol) {
  const b = buffers(n);
  for (let i = 0; i < n; i++) { const d = randDir(); put(b, i, d.map(v => v * radius), C.white, size * (.8 + R() * .4)); }
  return points(std(b), `${SNOISE}
    uniform vec3 uSun; uniform vec3 uCity; uniform float uR; uniform float uCities;
    void main(){
      vec3 nn = normalize(position);
      float land = smoothstep(0.02, 0.18, snoise(nn * 1.7) * 0.7 + snoise(nn * 4.2) * 0.3);
      float day = dot(nn, uSun);
      vec3 c = mix(vec3(0.05, 0.16, 0.42), vec3(0.32, 0.36, 0.22), land) * smoothstep(-0.15, 0.6, day) * 1.4;
      float lights = land * smoothstep(0.35, 0.8, snoise(nn * 16.0) * 0.6 + snoise(nn * 40.0) * 0.4) * (1.0 - smoothstep(-0.25, 0.05, day));
      c += uCity * lights * 2.2 * uCities;
      float rim = pow(1.0 - abs(dot(nn, normalize(cameraPosition - (modelMatrix * vec4(position, 1.0)).xyz))), 4.0);
      c += vec3(0.3, 0.55, 1.0) * rim * smoothstep(-0.3, 0.5, day) * 0.6;
      emit(position, aSize, c, 0.9);
    }`, { uSun: { value: sunDir }, uCity: { value: new THREE.Vector3(...cityCol) }, uR: { value: radius }, uCities: { value: 1 } });
}

  const DR = 5.6, seedDir = new THREE.Vector3(.75, .3, -.85).normalize();

      faces.push([va.clone(), vb.clone(), vc.clone()]);

      emit(position, aSize * (1.0 + 2.5 * pulse), aColor, 0.5 + 1.4 * pulse); }`));

  world.add(glow(0x7fa8ff, PR * 3.2, .12));

  // coming into view, then a push in on the sphere, centred, turning as it goes up
  const D = 9.0, view = new THREE.Vector3(), tgt = new THREE.Vector3(), O = new THREE.Vector3(0, 0, 0);
  const L = Math.log;
  const dist = t => Math.exp(L(1.15) + (L(2.6) - L(1.15)) * smooth(0, 2.2, t) + (L(30) - L(2.6)) * smooth(2.1, 4.2, t)

    sunGlow.material.opacity = .12 - .06 * uReveal.value;
    tgt.copy(P).lerp(O, smooth(2.35, 2.85, t));

    const ang = lerp(.35, 1.05, smooth(0, 2.4, t)) + lerp(0, -1.5, smooth(2.2, 4.4, t)) + .5 * smooth(4.4, 9, t);
    const el = lerp(.12, .26, smooth(0, 4.4, t)) - .08 * smooth(4.4, 9, t);
    view.set(Math.cos(el) * Math.sin(ang), Math.sin(el), Math.cos(el) * Math.cos(ang));

    camera.near = dist(t) * .01; camera.updateProjectionMatrix();

    camera.up.set(Math.sin(roll), Math.cos(roll), 0);
    camera.lookAt(tgt);

}

// ------------------------------------------------------------------ Civilización, in points: a planet, its star, its galaxy
if (PIECE === 'civ2') {

  // the galaxy, placed so that our star system is at the origin (precision for the close-ups)
  const r0 = 7.5, th0 = 2.3 * Math.log(r0), seed = new THREE.Vector3(Math.cos(th0) * r0, 0, Math.sin(th0) * r0);
  const pivot = new THREE.Group(); scene.add(pivot);

  const uBubble = { value: 0 }, uGal = { value: 0 };

      uniform vec3 uSeedP; uniform float uBubble; uniform vec3 uTeal; uniform float uGal;
      void main(){

  const starGlow = glow(0xffb070, S_R * 9, .25); scene.add(starGlow);
  const uSwarm = { value: 0 };
  {

    for (let k = 0; k < m; k++) {

    scene.add(points({ ...std(sw), aOrb: [orb, 3] }, `
      attribute vec3 aOrb; uniform float uSwarm;

  }
  const P = new THREE.Vector3(S_R * 7, S_R * .3, S_R * 3.5), PR = S_R * .12;
  const sunDir = P.clone().negate().normalize();

  // the camera: skimming the lit night side, a pull to the star and a turn inside its swarm, then a
  // fast flight out until the whole galaxy turns below, lighting up
  const D = 9.0, view = new THREE.Vector3(), tgt = new THREE.Vector3(), gc = new THREE.Vector3();
  const L = Math.log;
  const dist = t => Math.exp(L(PR * 1.5) + (L(PR * 4) - L(PR * 1.5)) * smooth(0, 1.1, t) + (L(S_R * 8) - L(PR * 4)) * smooth(1.1, 2.6, t)
                    - L(1.25) * smooth(2.6, 4.2, t) + (L(36) - L(S_R * 8 / 1.25)) * smooth(4.3, 6.5, t) - L(36 / 27) * smooth(6.5, 9, t));

    tgt.copy(P).lerp(new THREE.Vector3(0, 0, 0), smooth(1.0, 2.6, t)).lerp(gc, smooth(4.6, 7.2, t));
    const ang = lerp(-1.4, .5, smooth(0, 4.2, t)) + 1.1 * smooth(4.2, 9, t);
    const el = lerp(.05, .2, smooth(0, 4.2, t)) + .75 * smooth(4.4, 7.4, t);
    view.set(Math.cos(el) * Math.sin(ang), Math.sin(el), Math.cos(el) * Math.cos(ang));
    camera.position.copy(tgt).addScaledVector(view, dist(t));
    camera.near = dist(t) * .01; camera.updateProjectionMatrix();
    const roll = .25 * (1 - smooth(0, 2.4, t)) + .1 * Math.sin(t * .7) * smooth(4, 7, t);
    camera.up.set(Math.sin(roll), Math.cos(roll), 0);

// ------------------------------------------------------------------ Infinito, study: every universe is a point in a larger one
// A cosmic web of light; the camera pulls back until it collapses into a single point, which is one node of
// a larger web, which collapses in turn... The same web at every scale, so the loop has no seam: after one
// period each level stands exactly where the next one stood.
if (PIECE === 'infinito-niveles') {
  const F = 1 / 9;                  // a universe, seen from the next one, is this big
  const PERIOD = 4.5;               // seconds per level: two levels in the 9 s of the sequence
  const LEVELS = 7;
  const INF = col(0xc9b4ff), DEEP = col(0x6b4fd8);
  const web = (() => {
    // nodes: the centre (where the smaller universe sits) and clusters around it, joined by filaments
    const nodes = [[0, 0, 0, 1.6]];
    for (let i = 0; i < 70; i++) {
      const d = randDir(), r = .18 + .82 * Math.pow(R(), .7);
      nodes.push([d[0] * r, d[1] * r * .8, d[2] * r, .3 + Math.pow(R(), 3) * 1.6]);
    }
    const n = 60000, b = buffers(n);
    let i = 0;
    const add = (p, c, s) => { if (i < n) put(b, i++, p, c, s); };
    const dist2 = (a, c) => (a[0] - c[0]) ** 2 + (a[1] - c[1]) ** 2 + (a[2] - c[2]) ** 2;
    const links = [];
    nodes.forEach((a, ia) => {
      const near = nodes.map((c, ic) => [dist2(a, c), ic]).filter(([, ic]) => ic !== ia).sort((x, y) => x[0] - y[0]).slice(0, 3);
      for (const [, ic] of near) if (ia < ic || !links.some(([x, y]) => x === ic && y === ia)) links.push([ia, ic]);
    });
    // filaments first, thin and violet; a slight bow so they do not look ruled
    for (const [ia, ic] of links) {
      const a = nodes[ia], c = nodes[ic], len = Math.sqrt(dist2(a, c));
      const bow = randDir().map(v => v * len * .12);
      const m = Math.round(len * 900);
      for (let k = 0; k < m; k++) {
        const u = R(), w = 4 * u * (1 - u);
        const j = .006 + .01 * w;
        add([a[0] + (c[0] - a[0]) * u + bow[0] * w + gauss() * j, a[1] + (c[1] - a[1]) * u + bow[1] * w + gauss() * j, a[2] + (c[2] - a[2]) * u + bow[2] * w + gauss() * j],
            mix3(DEEP, INF, .35 + R() * .5), .0045 + R() * .004);
      }
    }
    // clusters at the nodes (not at the centre: that one is the smaller universe itself)
    for (const a of nodes.slice(1)) {
      const m = Math.round(160 * a[3]), sg = .012 + .012 * a[3];
      for (let k = 0; k < m; k++) add([a[0] + gauss() * sg, a[1] + gauss() * sg, a[2] + gauss() * sg], mix3(INF, C.white, .2 + R() * .6), .004 + R() * .005);
    }
    // a faint haze in the voids
    const haze = Math.min(n, i + 5000);
    while (i < haze) { const d = randDir(), r = Math.pow(R(), .5) * 1.1; add(d.map(v => v * r), mix3(DEEP, INF, R()).map(v => v * .35), .003 + R() * .003); }
    return { b, count: i };
  })();
  const geo = Object.fromEntries(Object.entries(std(web.b)).map(([k, [arr, sz]]) => [k, [arr.subarray(0, web.count * sz), sz]]));
  const levels = [];
  for (let k = 0; k < LEVELS; k++) {
    const uLevel = { value: 1 }, uFade = { value: 1 };
    const pts = points(geo, `
      uniform float uLevel; uniform float uFade;
      void main(){
        float tw = 0.75 + 0.25 * sin(uTime * (0.6 + aSeed * 1.7) + aSeed * 40.0);
        float z = -(modelViewMatrix * vec4(position, 1.0)).z;
        float px = aSize * uLevel * uScale / max(z, 1e-4);      // how big it would look: near ones become fine dust
        float size = aSize * uLevel * min(1.0, 7.0 / px);
        emit(position, size, aColor, uFade * tw * 0.55 * min(1.0, pow(5.0 / px, 0.7)) * smoothstep(0.2, 0.9, z));
      }`, { uLevel, uFade });
    const holder = new THREE.Group(); holder.add(pts); scene.add(holder);
    const g = glow(0xe9dcff, 1, 1); holder.add(g);
    levels.push({ holder, uFade, g });
  }
  scene.add(sky(7000, 700, 1500));
  const axis = new THREE.Vector3(.3, 1, .15).normalize();
  const L26 = Math.log(1 / F);
  // u: how far the zoom has gone, in levels; the level k is shown at scale F^(k - u), rotated by its own depth
  distAt = t => Math.exp(L26 * t / PERIOD);
  update = t => {
    const u = t / PERIOD, f = u - Math.floor(u);
    levels.forEach((lv, k) => {
      const depth = k - 1 + f;                       // 0 = the universe filling the view; grows as it recedes
      const s = Math.exp(-L26 * depth);              // its scale
      lv.holder.scale.setScalar(s);
      lv.holder.quaternion.setFromAxisAngle(axis, depth * 1.9);
      lv.holder.children[0].material.uniforms.uFade.value = smooth(11, 2.6, s) * smooth(.002, .02, s);
      // its centre: the point that is the next universe in; bright when small, gone when we are inside it
      lv.g.scale.setScalar(.09 * F);
      lv.g.material.opacity = 0;
      lv.holder.children[0].material.uniforms.uLevel.value = s;
    });
    // the point at the very centre: the smallest universe of all, always there
    const sway = TAU * t / 9;
    camera.position.set(Math.sin(sway) * .4, .6 + Math.cos(sway) * .15, 2.9);
    camera.near = .0005; camera.updateProjectionMatrix();
    camera.up.set(Math.sin(t * TAU / 9) * .08, 1, 0);
    camera.lookAt(0, 0, 0);
  };
}

// ------------------------------------------------------------------ Infinito: our universe is one bubble among many
// Inside our universe (a cosmic web), the camera pulls back: a wall appears, it is a bubble; around it other
// bubbles are born, each with its own colour (other laws), growing while the space between them keeps inflating.
// At the end all of it collapses into one point of light, the point Espacio begins with.
if (PIECE === 'infinito') {
  scene.add(sky(7000, 700, 1500));
  const INF = col(0xc9b4ff), DEEP = col(0x6b4fd8);
  const HUES = [col(0x6fe3c1), col(0xe3c48a), col(0xff8fb0), col(0x8fb4ff), col(0xff7a59), col(0xece7db), col(0xc9b4ff)];
  function makeWeb(n, nodeCount) {
    const nodes = [[0, 0, 0, 1.4]];
    for (let i = 0; i < nodeCount; i++) { const d = randDir(), r = .15 + .8 * Math.pow(R(), .7); nodes.push([d[0] * r, d[1] * r, d[2] * r, .3 + Math.pow(R(), 3) * 1.6]); }
    const b = buffers(n); let i = 0;
    const add = (p, w, s) => { if (i < n) { put(b, i++, p, [w, 0, 0], s); } };   // aColor.x = how bright (node vs filament)
    const d2 = (a, c) => (a[0] - c[0]) ** 2 + (a[1] - c[1]) ** 2 + (a[2] - c[2]) ** 2;
    const links = [];
    nodes.forEach((a, ia) => nodes.map((c, ic) => [d2(a, c), ic]).filter(([, ic]) => ic !== ia).sort((x, y) => x[0] - y[0]).slice(0, 3)
      .forEach(([, ic]) => { if (!links.some(([x, y]) => (x === ic && y === ia) || (x === ia && y === ic))) links.push([ia, ic]); }));
    let total = 0; for (const [ia, ic] of links) total += Math.sqrt(d2(nodes[ia], nodes[ic]));
    const fil = n * .6;
    for (const [ia, ic] of links) {
      const a = nodes[ia], c = nodes[ic], len = Math.sqrt(d2(a, c)), bow = randDir().map(v => v * len * .12);
      for (let k = 0, m = Math.round(fil * len / total); k < m; k++) {
        const u = R(), w = 4 * u * (1 - u), j = .006 + .01 * w;
        add([a[0] + (c[0] - a[0]) * u + bow[0] * w + gauss() * j, a[1] + (c[1] - a[1]) * u + bow[1] * w + gauss() * j, a[2] + (c[2] - a[2]) * u + bow[2] * w + gauss() * j], .45 + R() * .3, .0045 + R() * .004);
      }
    }
    const massTotal = nodes.reduce((acc, a) => acc + a[3], 0);
    for (const a of nodes) { const sg = .012 + .012 * a[3]; for (let k = 0, m = Math.round(n * .4 * a[3] / massTotal); k < m; k++) add([a[0] + gauss() * sg, a[1] + gauss() * sg, a[2] + gauss() * sg], .8 + R() * .5, .004 + R() * .005); }
    return std(b);
  }
  function makeShell(n) {
    const b = buffers(n);
    for (let i = 0; i < n; i++) put(b, i, randDir(), [1, 0, 0], .006 + R() * .006);
    return std(b);
  }
  const bigWeb = makeWeb(45000, 70), smallWeb = makeWeb(7000, 26), shell = makeShell(9000), smallShell = makeShell(3500);
  const WEB = `
    uniform float uOn; uniform vec3 uHue; uniform float uK;
    void main(){
      float tw = 0.75 + 0.25 * sin(uTime * (0.6 + aSeed * 1.7) + aSeed * 40.0);
      float z = -(modelViewMatrix * vec4(position, 1.0)).z;
      float px = aSize * uK * uScale / max(z, 1e-4);
      vec3 c = mix(uHue * 0.55, mix(uHue, vec3(1.0), 0.45), clamp(aColor.x - 0.4, 0.0, 1.0));
      emit(position, aSize * uK * min(1.0, 7.0 / px), c, uOn * tw * 0.55 * min(1.0, pow(5.0 / px, 0.7)) * smoothstep(0.02, 0.2, z / uK) * aColor.x);
    }`;
  const SHELL = `
    uniform float uOn; uniform vec3 uHue; uniform float uK;
    void main(){
      // a soap-film wall: brightest at the rim, where we look along it
      vec3 n = normalize(normalMatrix * position);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float rim = pow(1.0 - abs(dot(n, normalize(-mv.xyz))), 2.5);
      float px = aSize * uK * uScale / max(-mv.z, 1e-4);
      float shim = 0.7 + 0.3 * sin(uTime * 1.3 + aSeed * 30.0);
      emit(position, aSize * uK * min(1.0, 6.0 / px), mix(uHue, vec3(1.0), 0.35), uOn * (0.06 + 0.9 * rim) * shim * min(1.0, pow(4.0 / px, 0.7)));
    }`;
  const world = new THREE.Group(); scene.add(world);
  function bubble(webGeo, shellGeo, hue) {
    const g = new THREE.Group(); world.add(g);
    const u = { uOn: { value: 0 }, uHue: { value: new THREE.Vector3(...hue) }, uK: { value: 1 } };
    const w = points(webGeo, WEB, { uOn: { value: 0 }, uHue: u.uHue, uK: u.uK });
    const sh = points(shellGeo, SHELL, { uOn: { value: 0 }, uHue: u.uHue, uK: u.uK });
    const flash = glow(new THREE.Color(...hue).getHex(), 1, 0);
    g.add(w); g.add(sh); g.add(flash);
    g.rotation.set(R() * TAU, R() * TAU, 0);
    return { g, w, sh, flash, u };
  }
  // ours: already grown, at the origin
  const ours = bubble(bigWeb, shell, INF);
  // the others: born at random places and times; space inflates, so their centres drift apart
  const others = [];
  const toCam = new THREE.Vector3(Math.sin(-.5), .3, Math.cos(-.5)).normalize();   // where the camera starts looking from
  for (let k = 0; k < 46; k++) {
    let d, r, born;
    do {   // nothing is born between us and the camera while we are still inside
      d = randDir(); r = 2.2 + Math.pow(R(), .6) * 9; born = .8 + R() * 8.6 + (k < 6 ? -2 : 0);
      const c0 = new THREE.Vector3(d[0] * r, d[1] * r * .7, d[2] * r);
      var off = c0.clone().sub(toCam.clone().multiplyScalar(c0.dot(toCam))).length();   // how far from our line of sight
    } while ((born < 5.5 && new THREE.Vector3(...d).dot(toCam) > .35) || off < 1.25 + .22 * Math.max(0, 9 - born));
    const c = new THREE.Vector3(d[0] * r, d[1] * r * .7, d[2] * r);
    others.push({ ...bubble(smallWeb, smallShell, HUES[k % HUES.length]), c, born, v: .12 + R() * .1 });
  }
  const Hub = .055;                                // inflation: a(t) = e^(H t)
  const point = glow(0xf3ecff, .5, 0); scene.add(point);
  const core = glow(0xffffff, .12, 0); scene.add(core);
  // the collapse: the whole foam shrinks into one point (seen from a camera that keeps its distance)
  const K = t => Math.exp(-Math.log(500) * smooth(7.4, 9.6, t));
  const camD = t => Math.exp(Math.log(1.05) + (Math.log(4.2) - Math.log(1.05)) * smooth(1.4, 5.2, t) + (Math.log(14) - Math.log(4.2)) * smooth(4.6, 8.4, t));
  distAt = t => camD(t) / K(t);
  update = t => {
    const a = Math.exp(Hub * Math.min(t, 8.4)), k = K(t);
    world.scale.setScalar(k);
    ours.g.scale.setScalar(a); ours.u.uK.value = a * k;
    ours.w.material.uniforms.uOn.value = 1;
    ours.sh.material.uniforms.uOn.value = smooth(1.8, 4.2, t);
    ours.g.rotation.y = t * .06;
    for (const o of others) {
      const age = t - o.born;
      o.g.position.copy(o.c).multiplyScalar(a);
      const rad = Math.max(age, 0) * o.v * a + .001;
      o.g.scale.setScalar(rad); o.u.uK.value = rad * k;
      const born = smooth(0, .35, age);
      o.sh.material.uniforms.uOn.value = born;
      o.w.material.uniforms.uOn.value = smooth(.6, 2.6, age);   // structure forms inside after it is born
      o.flash.material.opacity = Math.exp(-Math.pow((age - .05) / .18, 2)) * .9;
      o.flash.scale.setScalar(.35 / Math.max(rad, .01));        // the flash keeps one size in the world
    }
    // the point: it gathers the light of everything as the foam shrinks, flares, and stays
    const gather = smooth(8.2, 9.5, t), flare = Math.exp(-Math.pow((t - 9.65) / .22, 2));
    point.material.opacity = .55 * gather + .5 * flare;
    point.scale.setScalar(.5 + 1.6 * flare + .06 * Math.sin(t * 5) * gather);
    core.material.opacity = gather;
    const ang = -.5 + .55 * smooth(0, 9, t), el = .25 + .25 * smooth(2, 9, t);
    const dd = camD(t);
    camera.position.set(Math.cos(el) * Math.sin(ang) * dd, Math.sin(el) * dd, Math.cos(el) * Math.cos(ang) * dd);
    camera.near = .002; camera.updateProjectionMatrix();
    camera.up.set(Math.sin(.12 * Math.sin(t * .5)), 1, 0);
    camera.lookAt(0, 0, 0);
  };
}

// ------------------------------------------------------------------ one frame
window.renderAt = t => {
  shared.uTime.value = t;
  update(t);
  // the zoom blur: how many decades a second the camera's distance is changing
  zoomBlur.uniforms.uStrength.value = distAt ? Math.min(Math.abs(Math.log10(distAt(t + .05) / distAt(t - .05))) * 10 * .06, .12) : 0;
  shared.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  composer.render();
  return true;
};
window.sceneReady = true;
</script>
</body>
